name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test_e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # The build prerenders pages that scrape metvuw.com, so it runs against the
    # local stand-in (e2e/stub) like the tests do: CI no longer depends on the
    # live site being up or keeping its markup.
    - name: Build app
      run: npm run e2e:build
    # playwright.config.ts starts the stub and the app with `npm run start`
    # (webServer), so the tests run against this build rather than a Vercel
    # preview (which Attack Mode challenges, blocking the runner).
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
